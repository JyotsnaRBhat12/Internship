<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark-blue: #1e3a8a;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --gold: #fbbf24;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--dark-blue);
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .msg-space {
            height: 45px;
            margin-bottom: 10px;
        }

        #statusMessage {
            display: none;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #64748b;
        }

        .required-star {
            color: var(--danger);
            margin-left: 2px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 4px;
            margin-bottom: 20px;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            font-size: 24px;
            color: #cbd5e1;
            cursor: pointer;
            transition: 0.2s;
        }

        .star-rating input:checked~label,
        .star-rating label:hover,
        .star-rating label:hover~label {
            color: var(--gold);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Feedback Form</h2>
        <div class="msg-space">
            <div id="statusMessage"></div>
        </div>
        <form id="feedbackForm">
            <label>Full Name <span class="required-star">*</span></label>
            <input type="text" id="userName" placeholder="John Doe" required>

            <label>Email Address <span class="required-star">*</span></label>
            <input type="email" id="userEmail" placeholder="john@example.com" required>

            <label>Your Message <span class="required-star">*</span></label>
            <textarea id="userMessage" rows="3" placeholder="How can we help?" required></textarea>

            <label>Overall Rating</label>
            <div class="star-rating">
                <input type="radio" name="stars" id="star5" value="5"><label for="star5">★</label>
                <input type="radio" name="stars" id="star4" value="4"><label for="star4">★</label>
                <input type="radio" name="stars" id="star3" value="3"><label for="star3">★</label>
                <input type="radio" name="stars" id="star2" value="2"><label for="star2">★</label>
                <input type="radio" name="stars" id="star1" value="1"><label for="star1">★</label>
            </div>

            <button type="submit">Submit Feedback</button>
        </form>
        <div class="footer"><a href="display.html">View All Submissions →</a></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
